<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>3D Snake: Town Runner</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec9ee; font-family: system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between;
           color: #fff; font-weight: 700; font-size: 22px; text-shadow: 0 2px 4px rgba(0,0,0,.45); pointer-events: none; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               color: #fff; text-align: center; background: rgba(10,20,40,.45); text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: clamp(32px, 8vw, 64px); margin: 0 0 8px; }
    #overlay p { margin: 4px 16px; font-size: clamp(14px, 3.5vw, 20px); }
    #flash { position: fixed; inset: 0; background: #ff3b30; opacity: 0; pointer-events: none; transition: opacity .35s; }
  </style>
</head>
<body>
  <div id="hud"><span id="score">Score 0</span><span id="best">Best 0</span></div>
  <div id="flash"></div>
  <div id="overlay">
    <h1 id="title">3D SNAKE</h1>
    <p id="subtitle">Town Runner</p>
    <p>&larr; &rarr; / A D: change lane &nbsp;&middot;&nbsp; Space / &uarr; / W: jump</p>
    <p>Swipe left/right to switch lanes, swipe up to jump</p>
    <p id="prompt"><b>Press Space or tap to start</b></p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
